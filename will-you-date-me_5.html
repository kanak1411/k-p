<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go On A Date With Me? 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ EASY CUSTOMIZATION: colors & fonts ============ */
  :root{
    --bg: #FFF6F0;
    --card-bg: #FFFFFF;
    --ink: #4A2545;
    --ink-soft: #8A6C84;
    --pink: #FF6B9D;
    --pink-deep: #E8467F;
    --yellow: #FFC93C;
    --mint: #6FCF97;
    --mint-deep: #4CAF7D;
    --lavender: #C9A7EB;
    --no-bg: #FFE1EA;
    --no-ink: #C24571;
    --shadow: 0 20px 50px -20px rgba(74,37,69,0.35);
    --radius-lg: 28px;
    --radius-md: 18px;
    --font-display: 'Baloo 2', cursive;
    --font-body: 'Quicksand', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- ambient floating background ---------- */
  .bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-decor span{
    position:absolute;
    font-size:1.6rem;
    opacity:.55;
    animation:float 7s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-24px) rotate(10deg);}
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:48px 36px;
    max-width:460px;
    width:100%;
    text-align:center;
    animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(30px) scale(.95);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  .eyebrow{
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:.78rem;
    color:var(--pink-deep);
    margin-bottom:10px;
  }

  h1.question{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.7rem,5vw,2.5rem);
    line-height:1.15;
    margin:0 0 14px;
  }

  .tease{
    min-height:1.4em;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 10px;
  }

  .dodge-chip{
    display:inline-block;
    background:var(--bg);
    border:1px solid rgba(74,37,69,.08);
    color:var(--ink-soft);
    font-size:.82rem;
    font-weight:600;
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:26px;
  }

  .btn-row{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    position:relative;
  }

  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:1.05rem;
    padding:16px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:focus-visible{outline:3px solid var(--pink-deep);outline-offset:3px;}

  .btn-yes{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;
    box-shadow:0 12px 24px -8px rgba(232,70,127,.55);
    transform-origin:center;
  }
  .btn-yes:hover{transform:translateY(-2px) scale(1.04);}

  .btn-no{
    background:var(--no-bg);
    color:var(--no-ink);
    box-shadow:0 8px 16px -8px rgba(194,69,113,.4);
    z-index:60;
  }
  /* gentle idle bob so it always reads as "alive" and bouncy */
  #noBtn{
    animation:noIdleBob 1.6s ease-in-out infinite;
  }
  @keyframes noIdleBob{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-6px) rotate(-4deg);}
  }
  /* once it's escaped into fixed positioning, moving between spots gets a spring */
  #noBtn.roaming{
    transition:left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1);
  }
  /* squash-and-stretch pop on every landing, overrides the idle bob while it plays */
  #noBtn.landing{
    animation:noLand .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes noLand{
    0%{transform:scale(1,1);}
    30%{transform:scale(.8,1.2);}
    55%{transform:scale(1.18,.82);}
    80%{transform:scale(.94,1.06);}
    100%{transform:scale(1,1);}
  }

  /* ---------- date picker stage ---------- */
  .option-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin:26px 0 30px;
  }
  .option-btn{
    background:var(--bg);
    border:2px solid transparent;
    border-radius:var(--radius-md);
    padding:18px 10px;
    font-family:var(--font-body);
    font-weight:600;
    font-size:.98rem;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .option-btn .emoji{font-size:1.8rem;}
  .option-btn:hover{border-color:var(--pink);transform:translateY(-3px);}
  .option-btn.selected{
    background:var(--pink);
    color:#fff;
    border-color:var(--pink-deep);
  }
  .option-btn:focus-visible{outline:3px solid var(--pink-deep);outline-offset:3px;}

  .btn-continue{
    background:var(--mint);
    color:#fff;
    width:100%;
    opacity:.45;
    pointer-events:none;
    box-shadow:0 12px 24px -8px rgba(76,175,125,.5);
  }
  .btn-continue.ready{
    opacity:1;
    pointer-events:auto;
  }
  .btn-continue.ready:hover{background:var(--mint-deep);transform:translateY(-2px);}

  /* ---------- done stage ---------- */
  .polaroid{
    background:#fff;
    border:1px solid rgba(0,0,0,.06);
    box-shadow:0 10px 25px -10px rgba(0,0,0,.25);
    padding:14px 14px 30px;
    border-radius:6px;
    width:210px;
    margin:0 auto 22px;
    transform:rotate(-3deg);
  }
  .photo-slot{
    width:100%;
    aspect-ratio:1/1;
    border:2px dashed var(--lavender);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--ink-soft);
    font-size:.82rem;
    line-height:1.4;
    overflow:hidden;
  }
  .photo-slot.has-photo{border-style:solid;border-color:transparent;}
  .photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
  .polaroid-caption{
    font-family:var(--font-display);
    text-align:center;
    margin-top:10px;
    color:var(--ink-soft);
    font-size:.92rem;
  }

  .done-note{color:var(--ink-soft);font-weight:600;margin-top:4px;}

  [hidden]{display:none !important;}

  /* ---------- confetti ---------- */
  .confetti{
    position:fixed;
    top:-24px;
    z-index:80;
    pointer-events:none;
    font-size:1.4rem;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{transform:translateY(110vh) rotate(720deg);opacity:.85;}
  }

  @media (max-width:380px){
    .card{padding:36px 22px;}
    .option-grid{grid-template-columns:1fr 1fr;gap:10px;}
  }

  @media (prefers-reduced-motion: reduce){
    .bg-decor span{animation:none;}
    .card{animation:none;}
    .btn,.option-btn{transition:none;}
    #noBtn{animation:none;}
  }
</style>
</head>
<body>

  <div class="bg-decor" aria-hidden="true">
    <span style="top:8%;left:12%;animation-delay:0s;">💖</span>
    <span style="top:15%;left:80%;animation-delay:1.2s;">✨</span>
    <span style="top:70%;left:8%;animation-delay:.6s;">🌸</span>
    <span style="top:80%;left:85%;animation-delay:1.8s;">💫</span>
    <span style="top:40%;left:5%;animation-delay:2.4s;">💌</span>
    <span style="top:55%;left:92%;animation-delay:.9s;">⭐</span>
    <span style="top:5%;left:45%;animation-delay:1.5s;">💕</span>
    <span style="top:88%;left:45%;animation-delay:.3s;">✨</span>
  </div>

  <main class="stage">

    <!-- ================= STAGE 1: THE ASK ================= -->
    <section class="card" id="askCard" data-stage="ask">
      <p class="eyebrow">💌 A little something for you</p>
      <h1 class="question" id="questionText">Will you go on a date with me?</h1>
      <p class="tease" id="teaseText">No pressure. (Okay, maybe a little.)</p>
      <span class="dodge-chip" id="dodgeChip" hidden>🏃 <span id="dodgeCountNum">0</span> dodge(s) so far</span>
      <div class="btn-row">
        <button class="btn btn-yes" id="yesBtn">Yes, obviously 💖</button>
        <button class="btn btn-no" id="noBtn">No</button>
      </div>
    </section>

    <!-- ================= STAGE 2: PICK THE DATE ================= -->
    <section class="card" id="pickCard" data-stage="pick" hidden>
      <p class="eyebrow">🎉 It's a yes!</p>
      <h1 class="question">Now — you pick our first date</h1>
      <div class="option-grid" id="optionGrid"></div>
      <button class="btn btn-continue" id="continueBtn">Let's do it →</button>
    </section>

    <!-- ================= STAGE 3: CONFIRMED ================= -->
    <section class="card" id="doneCard" data-stage="done" hidden>
      <div class="polaroid">
        <div class="photo-slot" id="photoSlot">
          <span>📷<br>our photo<br>goes here</span>
        </div>
        <p class="polaroid-caption">us, eventually</p>
      </div>
      <h1 class="question">It's a date! <span id="chosenLabel"></span></h1>
      <p class="done-note">I'll text you about time and place 💬</p>
    </section>

  </main>

73969XqXsES7e6ey0dbuLAkRzEewcb+pxjnk809qz/AETBoRgPEzlSzFcg4Hpzj/7r1epMpdnYrshSvlIdrMuct0BI969Xq9QI/9k="
  };

  const DATE_OPTIONS = [
    { emoji: "☕", label: "Coffee" },
    { emoji: "🍝", label: "Dinner" },
    { emoji: "🎬", label: "Movie" },
    { emoji: "🌅", label: "Adventure" },
    { emoji: "🎲", label: "Surprise me" }
  ];

  const TEASE_MESSAGES = [
    "No pressure. (Okay, maybe a little.)",
    "Oops, missed! 😄",
    "Nice try 👀",
    "It's quicker than you think, huh?",
    "Yes is right there though...",
    "C'mon, you know you want to 🥹",
    "This button has trust issues.",
    "Okay this is just cardio now 💪",
    "At this point it's basically a workout.",
    "The Yes button misses you already."
  ];

  const NO_LABELS = ["No", "Nope", "Nuh-uh", "Not quite", "Try again", "So close", "Almost!"];

  /* ============ state ============ */
  let dodgeCount = 0;
  let chosenDate = null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ elements ============ */
  const askCard = document.getElementById('askCard');
  const pickCard = document.getElementById('pickCard');
  const doneCard = document.getElementById('doneCard');
  const questionText = document.getElementById('questionText');
  const teaseText = document.getElementById('teaseText');
  const dodgeChip = document.getElementById('dodgeChip');
  const dodgeCountNum = document.getElementById('dodgeCountNum');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const optionGrid = document.getElementById('optionGrid');
  const continueBtn = document.getElementById('continueBtn');
  const photoSlot = document.getElementById('photoSlot');
  const chosenLabel = document.getElementById('chosenLabel');

  questionText.textContent = CONFIG.question;

  // BUG FIX: a CSS animation that ends on a non-"none" transform (even an
  // identity one like translateY(0) scale(1)) keeps the element acting as a
  // containing block for any fixed-position descendant — which is why the
  // No button's first jump landed relative to the card instead of the real
  // screen. Clearing the animation once it finishes removes that transform
  // entirely so #noBtn's position:fixed is relative to the actual viewport.
  function releaseCardTransform(card){
    card.addEventListener('animationend', function handler(e){
      if(e.target !== card) return;
      card.style.animation = 'none';
      card.removeEventListener('animationend', handler);
    });
  }
  [askCard, pickCard, doneCard].forEach(releaseCardTransform);

  /* ============ build date option buttons ============ */
  DATE_OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.innerHTML = `<span class="emoji">${opt.emoji}</span><span>${opt.label}</span>`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      chosenDate = opt;
      continueBtn.classList.add('ready');
    });
    optionGrid.appendChild(btn);
  });

  /* ============ the dodging No button ============ */
  // Use visualViewport when available so the button always lands somewhere
  // actually visible, even on mobile with an address bar / on-screen keyboard
  // eating part of window.innerHeight — that's what made it seem to "disappear".
  function getViewportBounds(){
    const vv = window.visualViewport;
    if(vv){
      return { left: vv.offsetLeft, top: vv.offsetTop, width: vv.width, height: vv.height };
    }
    return { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  }

  function placeNoButtonNearby(){
    const rect = noBtn.getBoundingClientRect();
    const margin = 16;
    const vp = getViewportBounds();

    // keep it out of the bottom slice of the screen, since that's where a
    // thumb usually sits when holding a phone one-handed
    const thumbZone = vp.height * 0.28;
    const minX = vp.left + margin;
    const minY = vp.top + margin;
    const maxX = Math.max(vp.left + vp.width - rect.width - margin, minX);
    const maxY = Math.max(vp.top + vp.height - thumbZone - rect.height - margin, minY);

    const curX = rect.left;
    const curY = rect.top;

    // hop a modest distance away in a random direction, rather than
    // teleporting anywhere on screen — stays findable, still escapes
    const hopMin = 90;
    const hopMax = 170;
    let x, y;
    for(let attempt = 0; attempt < 8; attempt++){
      const angle = Math.random() * Math.PI * 2;
      const dist = hopMin + Math.random() * (hopMax - hopMin);
      x = curX + Math.cos(angle) * dist;
      y = curY + Math.sin(angle) * dist;
      x = Math.min(Math.max(x, minX), maxX);
      y = Math.min(Math.max(y, minY), maxY);
      // make sure the clamped spot is still meaningfully far from where it was
      if(Math.hypot(x - curX, y - curY) > 40) break;
    }

    noBtn.style.position = 'fixed';
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.margin = '0';
  }

  // this is the actual dodge action: no event object needed, so it can be
  // triggered by proximity, clicks, taps, or anything else, forever.
  function dodge(){
    dodgeCount++;

    if(!reduceMotion){
      noBtn.classList.add('roaming');
      placeNoButtonNearby();

      // replay the squash-and-stretch bounce on every landing
      noBtn.classList.remove('landing');
      void noBtn.offsetWidth; // force reflow so the animation restarts
      noBtn.classList.add('landing');
    }

    noBtn.textContent = NO_LABELS[dodgeCount % NO_LABELS.length];
    teaseText.textContent = TEASE_MESSAGES[dodgeCount % TEASE_MESSAGES.length];

    const scale = Math.min(1 + dodgeCount * 0.06, 1.6);
    yesBtn.style.transform = `scale(${scale})`;

    dodgeChip.hidden = false;
    dodgeCountNum.textContent = dodgeCount;
  }

  // a short cooldown so one approach doesn't fire dozens of dodges per second
  let lastDodgeAt = 0;
  const DODGE_COOLDOWN_MS = 200;
  function tryDodge(){
    const now = Date.now();
    if(now - lastDodgeAt < DODGE_COOLDOWN_MS) return;
    lastDodgeAt = now;
    dodge();
  }

  function isPointerNearNoButton(x, y, radius){
    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.hypot(x - cx, y - cy) < radius;
  }

  noBtn.addEventListener('animationend', (e) => {
    if(e.animationName === 'noLand') noBtn.classList.remove('landing');
  });

  // CONSTANT dodging: as long as the ask screen is showing, any mouse/pen/touch
  // movement that gets within range of the button makes it jump — every single
  // time, indefinitely, not just on the first couple of hovers.
  document.addEventListener('pointermove', (e) => {
    if(askCard.hidden || reduceMotion) return;
    if(isPointerNearNoButton(e.clientX, e.clientY, 110)) tryDodge();
  });

  // direct-interaction fallbacks (first hover, quick taps, keyboard activation)
  noBtn.addEventListener('mouseenter', tryDodge);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); tryDodge(); }, { passive:false });
  noBtn.addEventListener('click', (e) => { e.preventDefault(); tryDodge(); });

  // if the viewport changes (rotation, keyboard, browser chrome), make sure
  // the button is still fully on-screen instead of stuck somewhere hidden
  window.visualViewport && window.visualViewport.addEventListener('resize', () => {
    if(noBtn.classList.contains('roaming') && !reduceMotion) placeNoButtonNearby();
  });

  /* ============ confetti ============ */
  function confettiBurst(count){
    if(reduceMotion) return;
    const emojis = ['💖','✨','🎉','🌸','💫'];
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      piece.style.left = Math.random()*100 + 'vw';
      const duration = 2.2 + Math.random()*1.4;
      const delay = Math.random()*0.4;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), (duration+delay)*1000 + 200);
    }
  }

  /* ============ stage transitions ============ */
  function showStage(card){
    [askCard, pickCard, doneCard].forEach(c => c.hidden = true);
    card.hidden = false;
    card.style.animation = 'none';
    // force reflow so the entrance animation replays
    void card.offsetWidth;
    card.style.animation = '';
    releaseCardTransform(card); // re-arm the cleanup for this fresh animation run
  }

  yesBtn.addEventListener('click', () => {
    showStage(pickCard);
    confettiBurst(28);
  });

  continueBtn.addEventListener('click', () => {
    if(!chosenDate) return;
    chosenLabel.textContent = `${chosenDate.emoji} ${chosenDate.label}`;

    if(CONFIG.photoSrc){
      photoSlot.innerHTML = `<img src="${CONFIG.photoSrc}" alt="A photo of us">`;
      photoSlot.classList.add('has-photo');
    }

    showStage(doneCard);
    confettiBurst(40);
  });
</script>

</body>
